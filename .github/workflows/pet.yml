name: My YourTomo cat

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate YourTomo pet
        uses: prsdx/github-pet@v1
        with:
          username: manjeetchugh
          timezone-offset-minutes: "330"
          display-name: "Manjeet"
          pet-name: "Typo"

      - name: Commit changes
       env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update YourTomo pet"
          git push
