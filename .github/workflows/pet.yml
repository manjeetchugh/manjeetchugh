name: My YourTomo cat
on:
  schedule:
    - cron: '23 */6 * * *'   # every 6h - pick your own minute
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prsdx/github-pet@v1
        with:
          username: manjeetchugh        # change me
          timezone-offset-minutes: "330" # UTC 5:30
           display-name: "Manjeet"
          pet-name: "neko"
          attribution: "false"
