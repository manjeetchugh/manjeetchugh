name: My PixelPet 

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PixelPet
        uses: manjeetchugh/pixelpet@main
        with:
          username: manjeetchugh
          token: ${{ secrets.GITHUB_TOKEN }}
          timezone-offset-minutes: "330"
          display-name: "Manjeet"
          pet-name: "Typo"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update PixelPet"
          git push
