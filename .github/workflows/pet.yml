name: My YourTomo cat

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug timezone
        run: |
          echo "Runner UTC:"
          date -u

          echo "Runner local:"
          date

          echo "Expected India time:"
          TZ=Asia/Kolkata date

          - name: Debug GitHub contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub API..."

          gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  login
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login="manjeetchugh" \
            --jq '
              .data.user.contributionsCollection.contributionCalendar
              | .weeks[].contributionDays[]
              | select(.contributionCount > 0)
              | "\(.date): \(.contributionCount)"
            '

      - name: Generate YourTomo pet
        uses: prsdx/github-pet@v1
        with:
          username: manjeetchugh
          timezone-offset-minutes: "330"
          display-name: "Manjeet"
          pet-name: "Typo"

      - name: Check generated greeting
        run: |
          echo "Generated SVG greeting:"
          grep -o -i -E '.{0,100}(good morning|good afternoon|good evening|up late).{0,100}' dist/pet.svg || true

      - name: Check generated files
        run: |
          echo "Generated files:"
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update YourTomo pet"
          git push
